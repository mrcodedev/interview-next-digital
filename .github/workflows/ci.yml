name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Message Convention
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6

  ci:
    name: Quality · Coverage · Build (Node ${{ matrix.node-version }})
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration quality gates
        run: npm run check

      - name: Generate coverage report
        if: matrix.node-version == 20
        run: npm run test:coverage

      - name: Build app
        run: npm run build

      - name: Upload coverage HTML report
        if: success() && matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker build · Smoke test
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: social-app
      CONTAINER_NAME: social-app-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            -p 8080:80 \
            $IMAGE_NAME:${{ github.sha }}

      - name: Smoke test — wait until app responds
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)
            echo "Attempt $i/15 - HTTP status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ The container responds correctly"
              exit 0
            fi
            sleep 2
          done
          echo "❌ The container did not become ready in time"
          exit 1

      - name: Verify that HTML is returned
        run: |
          BODY=$(curl -s http://localhost:8080)
          if echo "$BODY" | grep -q "<div id=\"root\">"; then
            echo "✅ The HTML is correct"
          else
            echo "❌ The HTML does not contain the expected root div"
            echo "$BODY" | head -c 400
            exit 1
          fi

      - name: Capture Docker logs on failure
        if: failure()
        run: docker logs $CONTAINER_NAME > docker-smoke.log 2>&1 || true

      - name: Upload Docker logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-logs
          path: docker-smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker tag $IMAGE_NAME:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker rm -f $CONTAINER_NAME || true
          docker image rm $IMAGE_NAME:${{ github.sha }} || true

  e2e:
    name: E2E Tests (Playwright · Chromium)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  trivy:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [ci, docker, e2e]
    timeout-minutes: 20
    env:
      TRIVY_IMAGE_NAME: social-app-trivy:${{ github.sha }}
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for security scanning
        run: docker build -t $TRIVY_IMAGE_NAME .

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Run Trivy enforcement scan (CRITICAL only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Run Trivy Docker image scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          scan-ref: ${{ env.TRIVY_IMAGE_NAME }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Run Trivy image enforcement scan (CRITICAL only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          scan-ref: ${{ env.TRIVY_IMAGE_NAME }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
